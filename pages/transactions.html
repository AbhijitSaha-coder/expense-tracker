<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions — SpendWise</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body data-page="transactions">
  <div id="app-shell"></div>
  <main id="page-content">
    <p class="page-intro">Add, edit, search, and manage all transactions.</p>

    <section class="panel">
      <h2 id="form-title">Add transaction</h2>
      <form id="transaction-form" novalidate>
        <input type="hidden" id="transaction-id" value="">
        <div class="form-row form-row--split">
          <div>
            <label for="transaction-type">Type</label>
            <select id="transaction-type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>
          <div>
            <label for="transaction-date">Date</label>
            <input type="date" id="transaction-date" required>
            <span class="form-error" id="error-date"></span>
          </div>
        </div>
        <div class="form-row">
          <label for="transaction-description">Description</label>
          <input type="text" id="transaction-description" maxlength="80" required>
          <span class="form-error" id="error-description"></span>
        </div>
        <div class="form-row form-row--split">
          <div>
            <label for="transaction-amount">Amount</label>
            <input type="number" id="transaction-amount" min="0.01" step="0.01" required>
            <span class="form-error" id="error-amount"></span>
          </div>
          <div>
            <label for="transaction-category">Category</label>
            <select id="transaction-category" required></select>
          </div>
        </div>
        <div class="form-row form-row--inline">
          <button type="submit" class="btn" id="submit-btn">Add Transaction</button>
          <button type="button" class="btn btn--secondary hidden" id="cancel-edit-btn">Cancel</button>
          <button type="button" class="btn btn--ghost" id="export-csv-btn">Export CSV</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>History</h2>
      <div class="filters-bar">
        <input type="search" id="search-input" class="search-input" placeholder="Search…">
        <select id="filter-category" aria-label="Category"></select>
        <input type="date" id="filter-from" aria-label="From date">
        <input type="date" id="filter-to" aria-label="To date">
        <select id="sort-by" aria-label="Sort">
          <option value="latest">Latest first</option>
          <option value="oldest">Oldest first</option>
          <option value="amount-high">Highest amount</option>
          <option value="amount-low">Lowest amount</option>
        </select>
      </div>
      <div id="list-skeleton"></div>
      <ul id="transaction-list" class="tx-list"></ul>
      <div id="tx-empty" class="hidden"></div>
    </section>
  </main>
  <script type="module" src="../js/pages/transactions.js"></script>
</body>
</html>
